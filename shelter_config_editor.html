<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>Shelter Furniture Config Editor</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#eee;padding:10px 20px;margin:0}
h1{color:#ffd700;font-size:20px;margin:10px 0}
.toolbar{position:sticky;top:0;z-index:100;background:#1a1a2e;padding:10px 0;border-bottom:1px solid #444;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar button{padding:8px 20px;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:bold}
.btn-export{background:#4CAF50;color:#fff}
.btn-import{background:#2196F3;color:#fff}
.btn-copy{background:#FF9800;color:#fff}
.stats{color:#aaa;font-size:13px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0;font-size:12px;color:#ccc}
.legend span{padding:2px 8px;border-radius:4px}
.theme-section{margin:20px 0;border:1px solid #333;border-radius:8px;overflow:hidden}
.theme-header{background:#2a2a4a;padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.theme-header h2{margin:0;color:#ffd700;font-size:16px}
.theme-header .count{color:#888;font-size:13px}
.theme-body{display:grid;grid-template-columns:repeat(auto-fill,280px);gap:10px;padding:12px}
.theme-body.collapsed{display:none}
.card{background:#252540;border-radius:6px;padding:8px;text-align:center;border:2px solid transparent;transition:border-color 0.2s}
.card:hover{border-color:#555}
.card.changed{border-color:#ffd700 !important}
.card img{width:240px;height:150px;object-fit:contain;background:#fff;border-radius:4px}
.card .no-img{width:240px;height:150px;background:#333;display:flex;align-items:center;justify-content:center;border-radius:4px;color:#666}
.info{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.fid{color:#888;font-size:11px}
.zh{color:#4f4;font-size:13px;font-weight:bold}
.ft-badge{font-size:10px;padding:1px 6px;border-radius:8px;color:#000}
.ft0{background:#888}.ft1{background:#8B4513;color:#fff}.ft2{background:#4169E1;color:#fff}.ft3{background:#2E8B57;color:#fff}
.controls{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ctrl-row{display:flex;align-items:center;gap:4px;font-size:12px}
.ctrl-row label{width:50px;text-align:right;color:#aaa;flex-shrink:0}
.ctrl-row select,.ctrl-row input{background:#1a1a2e;color:#eee;border:1px solid #555;border-radius:4px;padding:2px 4px;font-size:12px;flex:1}
.ctrl-row select:focus,.ctrl-row input:focus{border-color:#ffd700;outline:none}
.filter-bar{display:flex;gap:8px;align-items:center;font-size:13px}
.filter-bar select{background:#252540;color:#eee;border:1px solid #555;padding:4px 8px;border-radius:4px}
</style>
</head><body>

<h1>Shelter Furniture Config Editor</h1>

<div class="toolbar">
  <button class="btn-export" onclick="exportJSON()">Export JSON</button>
  <button class="btn-copy" onclick="copyJSON()">Copy to Clipboard</button>
  <button class="btn-import" onclick="document.getElementById('importFile').click()">Import JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  <span class="stats" id="stats"></span>
  <div class="filter-bar">
    <label>Filter:</label>
    <select id="filterFT" onchange="renderAll()">
      <option value="">All Types</option>
      <option value="0">0-普通</option>
      <option value="1">1-地板</option>
      <option value="2">2-墙纸</option>
      <option value="3">3-地毯</option>
    </select>
  </div>
</div>

<div class="legend">
  <b>furniture_index:</b>
  <span style="background:#ffd700;color:#000">1-装潢</span>
  <span style="background:#87ceeb;color:#000">2-桌椅</span>
  <span style="background:#dda0dd;color:#000">3-睡床</span>
  <span style="background:#98fb98;color:#000">4-柜架</span>
  <span style="background:#ffa07a;color:#000">5-摆件</span>
  <span style="background:#b0c4de;color:#000">6-墙饰</span>
  &nbsp;|&nbsp;
  <b>place_type:</b>
  <span style="color:#ff6b6b">1-靠墙</span>
  <span style="color:#4ecdc4">2-地面</span>
  <span style="color:#ffe66d">3-墙面</span>
  <span style="color:#a29bfe">4-顶面</span>
  &nbsp;|&nbsp;
  <b>furniture_type:</b>
  <span class="ft-badge ft0">普通</span>
  <span class="ft-badge ft1">地板</span>
  <span class="ft-badge ft2">墙纸</span>
  <span class="ft-badge ft3">地毯</span>
</div>

<div id="content"></div>

, "tid": 1014, "zh": "“主机蓝图”", "pic": "img_shelter_arcade_017", "img": "C:/Users/zhang_zy/BALL/ballclient/Assets/ResourcesAssets/UI/GUIBig/Shelter/Scene/Furniture/Furniture_scene/arcade/img_shelter_arcade_017.png", "idx": 6, "pt": 3, "gs": "2;1", "gm": "0;-2400", "ft": 0}, {"fid": 140018, "tid": 1014, "zh": "“复古之魂”", "pic": "img_shelter_arcade_018", "img": "C:/Users/zhang_zy/BALL/ballclient/Assets/ResourcesAssets/UI/GUIBig/Shelter/Scene/Furniture/Furniture_scene/arcade/img_shelter_arcade_018.png", "idx": 6, "pt": 3, "gs": "2;1", "gm": "0;-2400", "ft": 0}, {"fid": 140019, "tid": 1014, "zh": "街区霓虹", "pic": "img_shelter_arcade_019", "img": "C:/Users/zhang_zy/BALL/ballclient/Assets/ResourcesAssets/UI/GUIBig/Shelter/Scene/Furniture/Furniture_scene/arcade/img_shelter_arcade_019.png", "idx": 6, "pt": 3, "gs": "7;3", "gm": "0;-2400", "ft": 0}];
var THEMES = {"1001": "温馨厨房", "1002": "烘焙屋", "1003": "复古餐厅", "1004": "嘉年华潮流", "1005": "浴室", "1006": "森林小屋", "1007": "健身房", "1008": "地中海", "1009": "海洋", "1010": "太空", "1011": "玩具房", "1012": "情人节", "1013": "游乐园", "1014": "电玩城"};
var origData = {};
var curData = {};

ITEMS.forEach(function(it) {
  var gp = (it.gp === undefined || it.gp === null) ? "" : String(it.gp);
  origData[it.fid] = {idx: it.idx, pt: it.pt, gs: it.gs, gm: it.gm, ft: it.ft, gp: gp};
  curData[it.fid] = {idx: it.idx, pt: it.pt, gs: it.gs, gm: it.gm, ft: it.ft, gp: gp};
});

var IDX_OPTS = [
  [1,"1-\u88c5\u6f62"],[2,"2-\u684c\u6905"],[3,"3-\u7761\u5e8a"],
  [4,"4-\u67dc\u67b6"],[5,"5-\u6446\u4ef6"],[6,"6-\u5899\u9970"]
];
var PT_OPTS = [
  [1,"1-\u9760\u5899"],[2,"2-\u5730\u9762"],[3,"3-\u5899\u9762"],[4,"4-\u9876\u9762"]
];
var FT_OPTS = [
  [0,"0-\u666e\u901a"],[1,"1-\u5730\u677f"],[2,"2-\u5899\u7eb8"],[3,"3-\u5730\u6bef"]
];
var FT_NAMES = {0:"\u666e\u901a",1:"\u5730\u677f",2:"\u5899\u7eb8",3:"\u5730\u6bef"};

function makeSelect(fid, field, opts, cur) {
  var s = '<select data-fid="'+fid+'" data-field="'+field+'">';
  for (var i=0; i<opts.length; i++) {
    s += '<option value="'+opts[i][0]+'"'+(cur===opts[i][0]?' selected':'')+'>'+opts[i][1]+'</option>';
  }
  s += '</select>';
  return s;
}

function isChanged(fid) {
  var o = origData[fid], c = curData[fid];
  return c.idx !== o.idx || c.pt !== o.pt || c.gs !== o.gs || c.gm !== o.gm || c.ft !== o.ft || c.gp !== o.gp;
}

function renderAll() {
  var filterFT = document.getElementById("filterFT").value;
  var grouped = {};
  ITEMS.forEach(function(it) {
    var curFt = curData[it.fid].ft;
    if (filterFT !== "" && curFt != parseInt(filterFT)) return;
    if (!grouped[it.tid]) grouped[it.tid] = [];
    grouped[it.tid].push(it);
  });

  var h = "";
  var tids = Object.keys(grouped).map(Number).sort(function(a,b){return a-b});
  tids.forEach(function(tid) {
    var list = grouped[tid];
    var tname = THEMES[tid] || tid;
    h += '<div class="theme-section"><div class="theme-header" data-tid="'+tid+'">';
    h += '<h2>'+tname+' ('+tid+')</h2><span class="count">'+list.length+' items</span></div>';
    h += '<div class="theme-body" id="tb_'+tid+'">';

    list.forEach(function(it) {
      var d = curData[it.fid];
      var changed = isChanged(it.fid);
      h += '<div class="card'+(changed?" changed":"")+'" id="card_'+it.fid+'">';
      if (it.img) {
        h += '<img src="file:///'+it.img+'" loading="lazy">';
      } else {
        h += '<div class="no-img">No Image</div>';
      }
      h += '<div class="info"><span class="fid">'+it.fid+'</span>';
      h += '<span class="ft-badge ft'+d.ft+'">'+FT_NAMES[d.ft]+'</span></div>';
      h += '<div class="zh">'+it.zh+'</div>';
      h += '<div class="controls">';
      h += '<div class="ctrl-row"><label>\u7c7b\u578b:</label>'+makeSelect(it.fid,"ft",FT_OPTS,d.ft)+'</div>';
      h += '<div class="ctrl-row"><label>\u7d22\u5f15:</label>'+makeSelect(it.fid,"idx",IDX_OPTS,d.idx)+'</div>';
      h += '<div class="ctrl-row"><label>\u9762\u7247:</label>'+makeSelect(it.fid,"pt",PT_OPTS,d.pt)+'</div>';
      h += '<div class="ctrl-row"><label>\u5360\u683c:</label>';
      h += '<input type="text" data-fid="'+it.fid+'" data-field="gs" value="'+d.gs+'" placeholder="\u5bbd;\u9ad8">';
      h += '</div>';
      h += '<div class="ctrl-row"><label>\u79fb\u52a8:</label>';
      h += '<input type="text" data-fid="'+it.fid+'" data-field="gm" value="'+d.gm+'" placeholder="\u5bbd;\u9ad8">';
      h += '</div>';
      h += '<div class="ctrl-row"><label>\u7ec4:</label>';
      h += '<input type="text" data-fid="'+it.fid+'" data-field="gp" value="'+d.gp+'" placeholder="furniture_group">';
      h += '</div></div></div>';
    });
    h += '</div></div>';
  });
  document.getElementById("content").innerHTML = h;

  document.querySelectorAll('.theme-header').forEach(function(el) {
    el.onclick = function() {
      var tid = this.getAttribute('data-tid');
      document.getElementById('tb_'+tid).classList.toggle('collapsed');
    };
  });
  document.querySelectorAll('.controls select').forEach(function(sel) {
    sel.onchange = function() {
      var fid = parseInt(this.getAttribute('data-fid'));
      var field = this.getAttribute('data-field');
      curData[fid][field] = parseInt(this.value);
      refreshCard(fid);
    };
  });
  document.querySelectorAll('.controls input').forEach(function(inp) {
    inp.onchange = function() {
      var fid = parseInt(this.getAttribute('data-fid'));
      var field = this.getAttribute('data-field');
      curData[fid][field] = this.value.trim();
      refreshCard(fid);
    };
  });
  updateStats();
}

function refreshCard(fid) {
  var card = document.getElementById("card_"+fid);
  if (isChanged(fid)) {
    card.classList.add("changed");
  } else {
    card.classList.remove("changed");
  }
  // Update ft badge dynamically
  var badge = card.querySelector(".ft-badge");
  var d = curData[fid];
  badge.className = "ft-badge ft"+d.ft;
  badge.textContent = FT_NAMES[d.ft];
  updateStats();
}

function updateStats() {
  var changed = 0, total = Object.keys(curData).length;
  Object.keys(curData).forEach(function(fid) {
    if (isChanged(fid)) changed++;
  });
  document.getElementById("stats").textContent = "Changed: "+changed+" / "+total;
}

function getExportData() {
  var out = {};
  Object.keys(curData).forEach(function(fid) {
    var d = curData[fid];
    out[fid] = {
      furniture_index: d.idx,
      place_type: d.pt,
      grid_size: d.gs,
      grid_move: d.gm,
      furniture_type: d.ft,
      furniture_group: d.gp
    };
  });
  return out;
}

function exportJSON() {
  var j = JSON.stringify(getExportData(), null, 2);
  var blob = new Blob([j], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "furniture_config.json";
  a.click();
}

function copyJSON() {
  navigator.clipboard.writeText(JSON.stringify(getExportData(), null, 2)).then(function(){
    alert("Copied!");
  });
}

function importJSON(event) {
  var f = event.target.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      var n = 0;
      Object.keys(data).forEach(function(fid) {
        if (curData[fid]) {
          var d = data[fid];
          if (d.furniture_index !== undefined) curData[fid].idx = d.furniture_index;
          if (d.place_type !== undefined) curData[fid].pt = d.place_type;
          if (d.grid_size !== undefined) curData[fid].gs = d.grid_size;
          if (d.grid_move !== undefined) curData[fid].gm = d.grid_move;
          if (d.furniture_type !== undefined) curData[fid].ft = d.furniture_type;
          if (d.furniture_group !== undefined) curData[fid].gp = (d.furniture_group === null) ? "" : String(d.furniture_group);
          n++;
        }
      });
      renderAll();
      alert("Imported "+n+" items");
    } catch(err) {
      alert("Error: "+err.message);
    }
  };
  reader.readAsText(f);
}

renderAll();
</script>
