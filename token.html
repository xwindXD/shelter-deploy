<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Token 用量查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    font-family: -apple-system, sans-serif;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.container { width: 480px; }

.card {
    background: #16213e;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    margin-bottom: 16px;
}
h1 { font-size: 18px; text-align: center; margin-bottom: 20px; color: #e2e8f0; }
h2 { font-size: 14px; color: #e2e8f0; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }

.input-group { display: flex; gap: 8px; margin-bottom: 24px; }
.input-group input {
    flex: 1; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 13px;
}
.input-group input::placeholder { color: #64748b; }
.input-group button {
    padding: 10px 20px; border-radius: 8px; border: none;
    background: #3b82f6; color: #fff; font-size: 13px;
    cursor: pointer; font-weight: bold; white-space: nowrap;
}
.input-group button:hover { background: #2563eb; }
.input-group button:disabled { background: #475569; cursor: not-allowed; }

.result { display: none; }

.progress-wrap {
    background: #0f172a; border-radius: 12px; height: 28px;
    overflow: hidden; margin-bottom: 20px; position: relative;
}
.progress-bar {
    height: 100%; border-radius: 12px;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    transition: width 0.8s ease;
}
.progress-bar.warn { background: linear-gradient(90deg, #f59e0b, #d97706); }
.progress-bar.danger { background: linear-gradient(90deg, #ef4444, #dc2626); }
.progress-text {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 12px; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.stat-box { background: #0f172a; border-radius: 10px; padding: 14px; text-align: center; }
.stat-box .label { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
.stat-box .value { font-size: 18px; font-weight: bold; }
.stat-box .value.green { color: #22c55e; }
.stat-box .value.blue { color: #3b82f6; }
.stat-box .value.orange { color: #f59e0b; }
.stat-box .value.red { color: #ef4444; }

.detail {
    background: #0f172a; border-radius: 10px; padding: 14px;
    font-size: 12px; color: #94a3b8; line-height: 1.8;
}
.detail span { color: #e2e8f0; float: right; }

.error-msg {
    display: none; background: #451a1a; border: 1px solid #ef4444;
    border-radius: 8px; padding: 12px; font-size: 12px; color: #fca5a5;
    text-align: center; margin-bottom: 16px;
}

.save-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
    font-size: 11px; color: #64748b;
}
.save-row input[type="checkbox"] { cursor: pointer; }
.save-row label { cursor: pointer; }

/* 历史记录 */
.history-card {
    background: #16213e;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.history-actions { display: flex; gap: 8px; }
.btn-sm {
    padding: 4px 12px; border-radius: 6px; border: none;
    font-size: 11px; cursor: pointer;
}
.btn-clear-all { background: #dc2626; color: #fff; }
.btn-clear-all:hover { background: #b91c1c; }
.btn-export-h { background: #3b82f6; color: #fff; }
.btn-export-h:hover { background: #2563eb; }

.history-list { max-height: 400px; overflow-y: auto; }

.h-item {
    background: #0f172a; border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; position: relative;
    transition: background 0.2s;
}
.h-item:hover { background: #1e293b; }

.h-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.h-time { font-size: 11px; color: #94a3b8; }
.h-name { font-size: 11px; color: #64748b; margin-left: 8px; }
.h-btns { display: flex; gap: 6px; }
.h-btn {
    padding: 3px 10px; border-radius: 4px; border: none;
    font-size: 10px; cursor: pointer;
}
.h-btn-query { background: #3b82f6; color: #fff; }
.h-btn-query:hover { background: #2563eb; }
.h-btn-del { background: #475569; color: #cbd5e1; }
.h-btn-del:hover { background: #dc2626; color: #fff; }

.h-bars { display: flex; gap: 12px; align-items: center; }
.h-mini-bar {
    flex: 1; height: 8px; background: #1e293b;
    border-radius: 4px; overflow: hidden;
}
.h-mini-fill { height: 100%; border-radius: 4px; }
.h-mini-fill.green { background: #22c55e; }
.h-mini-fill.warn { background: #f59e0b; }
.h-mini-fill.danger { background: #ef4444; }

.h-stats {
    display: flex; gap: 16px; font-size: 11px; color: #94a3b8;
}
.h-stats .hs-val { color: #e2e8f0; font-weight: bold; }

.h-empty { text-align: center; color: #475569; font-size: 12px; padding: 24px 0; }

.h-diff { font-size: 10px; margin-left: 4px; }
.h-diff.up { color: #ef4444; }
.h-diff.down { color: #22c55e; }

/* 主题切换按钮 */
.theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 999;
    padding: 8px 16px; border-radius: 20px; border: none;
    font-size: 12px; cursor: pointer; font-weight: bold;
    transition: all 0.3s;
}

/* ========== 彩虹小猫主题 ========== */
body.nyan {
    background: linear-gradient(135deg, #fce4ec, #e8eaf6, #e0f7fa, #f3e5f5, #fff9c4);
    background-size: 400% 400%;
    animation: nyanBg 8s ease infinite;
}
@keyframes nyanBg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

body.nyan .card,
body.nyan .history-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(10px);
    border: 2px solid #f8bbd0;
    box-shadow: 0 4px 24px rgba(233,30,99,0.15);
}
body.nyan h1 { color: #e91e63; }
body.nyan h1::before { content: '🐱 '; }
body.nyan h1::after { content: ' 🌈'; }
body.nyan h2 { color: #7b1fa2; }

body.nyan .input-group input {
    background: #fce4ec; border-color: #f8bbd0; color: #333;
}
body.nyan .input-group input::placeholder { color: #e91e63; opacity: 0.5; }
body.nyan .input-group button { background: linear-gradient(135deg, #ff6f91, #ff9671, #ffc75f, #9be15d, #00d2fc, #c888e5); background-size: 300% 300%; animation: nyanBtn 3s ease infinite; }
@keyframes nyanBtn { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
body.nyan .input-group button:hover { filter: brightness(1.1); }

body.nyan .stat-box { background: rgba(248,187,208,0.2); border: 1px solid #f8bbd0; }
body.nyan .stat-box .label { color: #ad1457; }
body.nyan .stat-box .value.green { color: #2e7d32; }
body.nyan .stat-box .value.blue { color: #1565c0; }
body.nyan .stat-box .value.orange { color: #e65100; }
body.nyan .stat-box .value.red { color: #c62828; }

body.nyan .progress-wrap { background: rgba(248,187,208,0.3); }
body.nyan .progress-bar { background: linear-gradient(90deg, #ff6f91, #ff9671, #ffc75f, #9be15d, #00d2fc, #c888e5); background-size: 300% 100%; animation: nyanBar 2s linear infinite; }
body.nyan .progress-bar.warn { background: linear-gradient(90deg, #ff6f91, #ff9671, #ffc75f, #9be15d, #00d2fc, #c888e5); background-size: 300% 100%; animation: nyanBar 2s linear infinite; }
body.nyan .progress-bar.danger { background: linear-gradient(90deg, #ff6f91, #ff9671, #ffc75f, #9be15d, #00d2fc, #c888e5); background-size: 300% 100%; animation: nyanBar 2s linear infinite; }
@keyframes nyanBar { 0%{background-position:0% 0} 100%{background-position:300% 0} }

body.nyan .detail { background: rgba(248,187,208,0.15); color: #666; border: 1px solid #f8bbd0; }
body.nyan .detail span { color: #333; }

body.nyan .save-row { color: #ad1457; }
body.nyan .error-msg { background: #fce4ec; border-color: #e91e63; color: #c62828; }

body.nyan .h-item { background: rgba(248,187,208,0.15); border: 1px solid rgba(248,187,208,0.4); }
body.nyan .h-item:hover { background: rgba(248,187,208,0.3); }
body.nyan .h-time { color: #ad1457; }
body.nyan .h-name { color: #7b1fa2; }
body.nyan .h-btn-query { background: linear-gradient(90deg, #ff6f91, #c888e5); }
body.nyan .h-btn-del { background: #f8bbd0; color: #c62828; }
body.nyan .h-btn-del:hover { background: #e91e63; color: #fff; }
body.nyan .h-mini-bar { background: rgba(248,187,208,0.3); }
body.nyan .h-mini-fill.green { background: linear-gradient(90deg, #9be15d, #00d2fc); }
body.nyan .h-mini-fill.warn { background: linear-gradient(90deg, #ffc75f, #ff9671); }
body.nyan .h-mini-fill.danger { background: linear-gradient(90deg, #ff6f91, #c888e5); }
body.nyan .h-stats { color: #666; }
body.nyan .h-stats .hs-val { color: #333; }
body.nyan .h-empty { color: #e91e63; }
body.nyan .h-empty::before { content: '🐾 '; }

body.nyan .btn-export-h { background: linear-gradient(90deg, #00d2fc, #9be15d); color: #333; }
body.nyan .btn-clear-all { background: #f8bbd0; color: #c62828; }
body.nyan .btn-clear-all:hover { background: #e91e63; color: #fff; }

body.nyan .theme-toggle { background: #16213e; color: #e2e8f0; }
body.nyan .theme-toggle:hover { background: #1e293b; }

/* 默认主题的切换按钮 */
body:not(.nyan) .theme-toggle { background: linear-gradient(90deg, #ff6f91, #ffc75f, #9be15d, #00d2fc, #c888e5); background-size: 300% 300%; animation: nyanBtn 3s ease infinite; color: #fff; }
body:not(.nyan) .theme-toggle:hover { filter: brightness(1.1); }

/* 小猫装饰 */
.nyan-cat {
    display: none; position: fixed; bottom: 20px; left: 20px;
    font-size: 48px; z-index: 999;
    animation: nyanFloat 2s ease-in-out infinite;
}
body.nyan .nyan-cat { display: block; }
@keyframes nyanFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

.nyan-rainbow {
    display: none; position: fixed; bottom: 45px; left: 75px;
    width: 60px; height: 24px; z-index: 998;
    background: linear-gradient(180deg, #ff0000 0%, #ff0000 16.6%, #ff9900 16.6%, #ff9900 33.2%, #ffff00 33.2%, #ffff00 49.8%, #33ff00 49.8%, #33ff00 66.4%, #0099ff 66.4%, #0099ff 83%, #6633ff 83%, #6633ff 100%);
    border-radius: 2px;
    animation: nyanRainbow 0.3s steps(2) infinite;
}
body.nyan .nyan-rainbow { display: block; }
@keyframes nyanRainbow { 0%{opacity:0.8} 100%{opacity:1} }
</style>
</head>
<body>

<button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🐱 彩虹小猫</button>
<div class="nyan-cat">🐱</div>
<div class="nyan-rainbow"></div>

<div class="container">
<div class="card">
    <h1>API Token 用量查询</h1>

    <div class="input-group">
        <input type="password" id="apiKey" placeholder="输入你的 API Key (sk-...)" />
        <button id="queryBtn" onclick="query()">查询</button>
    </div>

    <div class="save-row">
        <input type="checkbox" id="saveKey" checked>
        <label for="saveKey">记住 Key（存在浏览器本地）</label>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="result" id="result">
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
            <div class="progress-text" id="progressText"></div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="label">剩余额度</div>
                <div class="value green" id="remaining">-</div>
            </div>
            <div class="stat-box">
                <div class="label">已使用</div>
                <div class="value orange" id="used">-</div>
            </div>
            <div class="stat-box">
                <div class="label">总额度</div>
                <div class="value blue" id="total">-</div>
            </div>
            <div class="stat-box">
                <div class="label">使用率</div>
                <div class="value" id="rate">-</div>
            </div>
        </div>

        <div class="detail">
            <div>账户 <span id="acctName">-</span></div>
            <div>无限额度 <span id="unlimited">-</span></div>
            <div>查询时间 <span id="queryTime">-</span></div>
        </div>
    </div>
</div>

<div class="history-card">
    <h2>
        查询历史
        <div class="history-actions">
            <button class="btn-sm btn-export-h" onclick="exportHistory()">导出</button>
            <button class="btn-sm btn-clear-all" onclick="clearHistory()">清空</button>
        </div>
    </h2>
    <div class="history-list" id="historyList">
        <div class="h-empty">暂无查询记录</div>
    </div>
</div>
</div>

<script>
const saved = localStorage.getItem('api_key_token');
if (saved) document.getElementById('apiKey').value = saved;

let history = JSON.parse(localStorage.getItem('token_history') || '[]');

function fmt(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + ' B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + ' M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + ' K';
    return n.toString();
}

function fmtDiff(curr, prev) {
    if (!prev) return '';
    const diff = curr - prev;
    if (diff === 0) return '';
    const arrow = diff > 0 ? '+' : '';
    const cls = diff > 0 ? 'up' : 'down';
    return `<span class="h-diff ${cls}">${arrow}${fmt(diff)}</span>`;
}

function saveHistory() {
    localStorage.setItem('token_history', JSON.stringify(history));
}

function addToHistory(data) {
    const now = new Date();
    const record = {
        time: now.toLocaleString('zh-CN'),
        ts: now.getTime(),
        name: data.name || '-',
        key: data._key || '',
        used: data.total_used,
        available: data.total_available,
        granted: data.total_granted,
        pct: data.total_granted > 0 ? (data.total_used / data.total_granted * 100) : 0,
    };
    history.unshift(record);
    if (history.length > 50) history = history.slice(0, 50);
    saveHistory();
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (!history.length) {
        list.innerHTML = '<div class="h-empty">暂无查询记录</div>';
        return;
    }
    list.innerHTML = history.map((h, i) => {
        const prev = history[i + 1];
        const usedDiff = prev ? fmtDiff(h.used, prev.used) : '';
        const barCls = h.pct < 50 ? 'green' : h.pct < 80 ? 'warn' : 'danger';
        return `<div class="h-item">
            <div class="h-top">
                <div>
                    <span class="h-time">${h.time}</span>
                    <span class="h-name">${h.name}</span>
                </div>
                <div class="h-btns">
                    <button class="h-btn h-btn-query" onclick="requery(${i})">查询</button>
                    <button class="h-btn h-btn-del" onclick="delRecord(${i})">删除</button>
                </div>
            </div>
            <div class="h-bars">
                <div class="h-mini-bar"><div class="h-mini-fill ${barCls}" style="width:${h.pct}%"></div></div>
                <span style="font-size:11px;color:#94a3b8;min-width:45px;text-align:right">${h.pct.toFixed(1)}%</span>
            </div>
            <div class="h-stats" style="margin-top:6px">
                <div>已用 <span class="hs-val">${fmt(h.used)}</span>${usedDiff}</div>
                <div>剩余 <span class="hs-val">${fmt(h.available)}</span></div>
                <div>总量 <span class="hs-val">${fmt(h.granted)}</span></div>
            </div>
        </div>`;
    }).join('');
}

function delRecord(i) {
    history.splice(i, 1);
    saveHistory();
    renderHistory();
}

function clearHistory() {
    if (!confirm('确定清空全部查询历史？')) return;
    history = [];
    saveHistory();
    renderHistory();
}

function exportHistory() {
    if (!history.length) { alert('没有历史记录'); return; }
    const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'token查询历史_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
}

function requery(idx) {
    const h = history[idx];
    if (h && h.key) {
        document.getElementById('apiKey').value = h.key;
    }
    query();
}

async function query() {
    const key = document.getElementById('apiKey').value.trim();
    if (!key) { showError('请输入 API Key'); return; }

    if (document.getElementById('saveKey').checked) {
        localStorage.setItem('api_key_token', key);
    } else {
        localStorage.removeItem('api_key_token');
    }

    const btn = document.getElementById('queryBtn');
    btn.disabled = true; btn.textContent = '查询中...';
    document.getElementById('errorMsg').style.display = 'none';
    document.getElementById('result').style.display = 'none';

    try {
        const r = await fetch('https://ai-gw-cn.uuzu.com/api/usage/token/', {
            headers: { 'Authorization': 'Bearer ' + key }
        });
        const json = await r.json();

        if (!json.code || !json.data) {
            showError(json.message || '查询失败');
            return;
        }

        const d = json.data;
        d._key = key;
        const pct = d.total_granted > 0 ? (d.total_used / d.total_granted * 100) : 0;

        document.getElementById('remaining').textContent = fmt(d.total_available);
        document.getElementById('used').textContent = fmt(d.total_used);
        document.getElementById('total').textContent = fmt(d.total_granted);

        const rateEl = document.getElementById('rate');
        rateEl.textContent = pct.toFixed(1) + '%';
        rateEl.className = 'value ' + (pct < 50 ? 'green' : pct < 80 ? 'orange' : 'red');

        const bar = document.getElementById('progressBar');
        bar.style.width = pct + '%';
        bar.className = 'progress-bar' + (pct < 50 ? '' : pct < 80 ? ' warn' : ' danger');
        document.getElementById('progressText').textContent = '已用 ' + pct.toFixed(1) + '% · 剩余 ' + fmt(d.total_available);

        document.getElementById('acctName').textContent = d.name || '-';
        document.getElementById('unlimited').textContent = d.unlimited_quota ? '是' : '否';
        const now = new Date();
        document.getElementById('queryTime').textContent = now.toLocaleString('zh-CN');

        document.getElementById('result').style.display = 'block';

        addToHistory(d);
    } catch (e) {
        showError('网络错误: ' + e.message);
    } finally {
        btn.disabled = false; btn.textContent = '查询';
    }
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
}

document.getElementById('apiKey').addEventListener('keydown', e => {
    if (e.key === 'Enter') query();
});

renderHistory();

const savedTheme = localStorage.getItem('token_theme');
if (savedTheme === 'nyan') applyNyan(true);

function toggleTheme() {
    const isNyan = document.body.classList.contains('nyan');
    applyNyan(!isNyan);
    localStorage.setItem('token_theme', !isNyan ? 'nyan' : 'default');
}

function applyNyan(on) {
    document.body.classList.toggle('nyan', on);
    document.getElementById('themeBtn').textContent = on ? '🌙 默认主题' : '🐱 彩虹小猫';
}
</script>
</body>
</html>
